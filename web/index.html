<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>技術ノート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="heading">今日</h1>
    <span id="date" class="muted"></span>
  </header>

  <main>
    <section id="view-today"></section>
    <section id="view-review" hidden></section>
    <section id="view-settings" hidden>
      <h2>復習データのバックアップ</h2>
      <p class="muted">復習の記録はこの端末のブラウザに保存されています。機種変更の前にエクスポートしてください。</p>
      <button id="export" class="btn">エクスポート</button>
      <textarea id="backup" rows="6" placeholder="ここにエクスポート結果が表示されます。インポートするときはここに貼り付けます。"></textarea>
      <button id="import" class="btn secondary">インポート</button>
      <p id="settings-msg" class="muted" role="status"></p>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="today" class="active">今日</button>
    <button data-view="review">復習 <span id="due-badge" class="badge" hidden></span></button>
    <button data-view="settings">設定</button>
  </nav>

  <template id="term-tpl">
    <article class="card term">
      <div class="label">基礎用語</div>
      <h3 class="name"></h3>
      <p class="def"></p>
    </article>
  </template>

  <template id="topic-tpl">
    <article class="card topic">
      <div class="label field"></div>
      <h3 class="title"></h3>
      <img class="photo" alt="" referrerpolicy="no-referrer" hidden>
      <p class="question"></p>
      <textarea class="guess" rows="2" placeholder="自分の予想を書いてみる（保存はされません）"></textarea>
      <button class="btn reveal">答えを見る</button>
      <div class="answer" hidden>
        <h4>要点</h4>
        <ol class="summary"></ol>
        <h4>仕組み</h4>
        <ol class="flow" hidden></ol>
        <p class="mechanism"></p>
        <h4>基礎用語</h4>
        <div class="terms"></div>
        <p class="term-def muted" hidden></p>
        <div class="connections-wrap">
          <h4>つながり</h4>
          <ul class="connections"></ul>
        </div>
        <div class="hook"></div>
        <a class="btn secondary video" target="_blank" rel="noopener">▶ YouTubeで動画を探す</a>
        <a class="source" target="_blank" rel="noopener"></a>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
