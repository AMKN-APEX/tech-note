[project]
name = "generator"
version = "0.1.0"
description = "Daily tech trivia card generator"
requires-python = ">=3.12"
dependencies = ["feedparser>=6", "pydantic>=2"]

[dependency-groups]
dev = [
    "nodejs-wheel-binaries>=24.19.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
